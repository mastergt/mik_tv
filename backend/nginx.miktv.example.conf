# Reference only: if miktv.artelmik.ru already has a server block, edit that
# block instead of adding a second server with the same listen/server_name.
# Main domain handles BOTH the discovery endpoint and the actual IPTV API.
server {
    listen 95.174.96.15:443 ssl;
    server_name miktv.artelmik.ru;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /usr/local/certs/miktv.artelmik.ru/fullchain.cer;
    ssl_certificate_key /usr/local/certs/miktv.artelmik.ru/miktv.artelmik.ru.key;

    access_log /var/log/nginx/miktv.api.access.log;
    error_log /var/log/nginx/miktv.api.error.log error;

    location /api/ {
        proxy_pass http://127.0.0.1:4012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Trust only the address nginx itself saw; backend listens on 127.0.0.1.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    location / { return 404; }
}
