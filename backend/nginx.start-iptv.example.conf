# Dedicated discovery hostname for mik_tv (NOT the previous IPTV system).
# Configure DNS A/AAAA and obtain a valid TLS certificate before use.
# This block assumes NestJS runs on localhost:4012.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name start.iptv.artelmik.ru;

    ssl_certificate     /etc/letsencrypt/live/start.iptv.artelmik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/start.iptv.artelmik.ru/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:4012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite any client-provided X-Real-IP (never use raw X-Forwarded-For).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name start.iptv.artelmik.ru;
    return 301 https://$host$request_uri;
}
