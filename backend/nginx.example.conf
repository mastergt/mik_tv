# Example fragment inside an HTTPS server{} block. Put limit_req_zone in nginx http{}.
# http{}:
# limit_req_zone $binary_remote_addr zone=iptv_login:10m rate=5r/m;

location = /api/v1/auth/login {
    limit_req zone=iptv_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:4012;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /api/ {
    proxy_pass http://127.0.0.1:4012;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
