# Inside an existing HTTPS server { ... } block.
# The example assumes files from dist/iptv-admin-ui/browser/ copied to /var/www/iptv-admin/.
# IMPORTANT: Do not nest this example inside an existing location / block.

location /api/ {
    proxy_pass http://127.0.0.1:4012;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

location / {
    root /var/www/iptv-admin;
    try_files $uri $uri/ /index.html;
}
