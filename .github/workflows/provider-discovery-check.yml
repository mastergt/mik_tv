name: Provider discovery backend/frontend checks
on:
  push:
    paths: ['backend/**', 'frontend/**', 'database/**', '.github/workflows/provider-discovery-check.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'database/**', '.github/workflows/provider-discovery-check.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm run test
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
