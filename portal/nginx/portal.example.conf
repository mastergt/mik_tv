# Add these locations INSIDE an existing Nginx server block.
# Do not copy "server" blocks or overwrite the current HTTPS admin config.
# HTTP should be used only on an operator-controlled LAN for boxes without HTTPS.

location = /portal { return 301 /portal/; }
location ^~ /portal/ {
    alias /usr/local/nodejs/dev/iptv_front/portal/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
    # Prevent caches from keeping an old portal JS during rollout.
    add_header Cache-Control "no-cache";
}

# Only add this if /api/v1/ is not already proxied in the same server block.
# Trailing slash is intentionally OMITTED in proxy_pass: preserve /api/v1/ URL.
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:4012;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
